[workspace]
resolver = "2"
members = [
    "crates/bt-core",
    "crates/bt-data",
    "crates/bt-analytics",
    "crates/bt-viz",
    "crates/bt-cli",
    "crates/bt-app",
]

[workspace.package]
version = "4.0.0"
edition = "2021"
authors = ["Sourish Dey"]
license = "MIT"
description = "Bharat Terminal v4 — 190+ visualizations, alerts, news, calendar, real market data, Windows installer. Made by Sourish Dey."

[workspace.dependencies]
thiserror = "1.0"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tracing = "0.1"
plotters = { version = "0.3", features = ["svg", "bitmap"] }
image = "0.25"
rayon = "1.10"
rusqlite = { version = "0.32", features = ["bundled"] }
futures-util = "1.10"
tokio-tungstenite = "0.24"
clap = { version = "4.5", features = ["derive", "env"] }
egui = "0.28"
eframe = { version = "0.28", default-features = false, features = ["default", "persistence", "accesskit"] }
egui_plot = "0.28"
# Forecasting (bt-analytics): Granite TTM + NanoForecast + ARIMA fallback.
# ort uses load-dynamic so the ONNX runtime is dlopen()ed at runtime only;
# builds and tests stay hermetic with no ONNX binaries required.
ort = { version = "2.0.0-rc.10", features = ["load-dynamic", "ndarray"] }
oxidiviner = "1"
ndarray = "0.15"
# Frequency-domain cycle extrapolation for the FFT paradigm on the Forecast tab.
# Pure Rust, no BLAS: a 256-point transform is tens of microseconds.
rustfft = "6.2"
sysinfo = "0.30"
# v4.0 additions: RSS parsing (News tab), VADER sentiment (news + alerts),
# fuzzy symbol search (header dropdown), native Windows toasts (alerts).
feed-rs = "2"
vader_sentiment = "0.1"
fuzzy-matcher = "0.3"
winrt-notification = "0.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"