[package]
name = "bt-app"
version.workspace = true
edition.workspace = true
authors = ["Sourish Dey"]
license.workspace = true
description = "Bharat Terminal desktop app (egui/eframe) — real data, 21 tabs, async. Made by Sourish Dey."

[[bin]]
name = "bt-app"
path = "src/main.rs"

[build-dependencies]
embed-resource = "3"

[dependencies]
bt-core = { path = "../bt-core" }
bt-viz = { path = "../bt-viz" }
bt-data = { path = "../bt-data" }
bt-analytics = { path = "../bt-analytics" }

# Upgraded to 0.28.1 for Windows compatibility
eframe = { version = "0.28.1", default-features = false, features = ["glow", "default_fonts", "persistence", "accesskit"] }
egui = "0.28"
egui_plot = "0.28"
tokio = { version = "1", features = ["full"] }
chrono = "0.4"
thiserror = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = { workspace = true }
tracing = { workspace = true }

# Optional loopback JSON API over the same cache and ONNX engines the UI uses.
# Off unless BHARAT_API=1; see src/api.rs.
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }

# v4.0: fuzzy symbol search in the header dropdown.
fuzzy-matcher = { workspace = true }

# v4.2: on-device SmolLM2-135M chat via Candle (pure Rust, no C++ toolchain).
# CPU-only; the GGUF (~105 MB) and tokenizer.json live in models/ and load
# lazily on first chat use, never at startup. hf-hub is deliberately absent:
# the tokenizer ships via scripts/download-tokenizer.ps1, so nothing downloads
# at build or run time.
candle-core = { version = "0.9", default-features = false }
candle-transformers = { version = "0.9", default-features = false }
candle-nn = { version = "0.9", default-features = false }
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }

[target.'cfg(windows)'.dependencies]
# v4.0: native Windows toast notifications for fired alerts. Best-effort:
# failures are swallowed and the in-app toast is always shown.
winrt-notification = { workspace = true }
# v4.1: opt-in voice alerts via Windows SAPI (pure COM, no C++ toolchain).
# Kept minimal on purpose: only the COM + speech bindings this file uses.
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_Media_Speech",
] }

[dev-dependencies]
# Router-level tests drive the app with `tower::ServiceExt::oneshot`.
tower = { version = "0.5", features = ["util"] }