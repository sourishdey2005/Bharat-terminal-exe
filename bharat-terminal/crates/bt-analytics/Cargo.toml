[package]
name = "bt-analytics"
version.workspace = true
edition.workspace = true
authors = ["Sourish Dey"]
license.workspace = true
description = "Bharat Terminal technical indicators and risk analytics. Made by Sourish Dey."

[dependencies]
bt-core = { path = "../bt-core" }
rayon = "1.10"
thiserror = "1"
chrono = { workspace = true }
tracing = { workspace = true }
# py_bridge speaks JSON to the embedded Python predictor, so the request/response
# types need serde derives rather than hand-rolled parsing.
serde = { workspace = true }
serde_json = { workspace = true }
ort = { workspace = true }
oxidiviner = "1"
rustfft = { workspace = true }
sysinfo = { workspace = true }
# v4.0: VADER lexicon sentiment for news headlines (News tab).
vader_sentiment = { workspace = true }

[dev-dependencies]
# Integration tests in tests/ need bt-core directly to build candle fixtures.
bt-core = { path = "../bt-core" }
