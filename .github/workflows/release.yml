name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: bharat-terminal
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Rust
        uses: dtolnay/rust-action@stable
      
      - name: Build
        run: cargo build --release --workspace
      
      - name: Install WiX Toolset
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add --global WixToolset.UI.wixext/5.0.2
      
      - name: Fetch pinned ONNX Runtime
        run: |
          New-Item -ItemType Directory -Path "native" -Force | Out-Null
          curl.exe -sL --max-time 300 -o "$env:TEMP\onnxruntime-win-x64.zip" "https://github.com/microsoft/onnxruntime/releases/download/v1.28.0/onnxruntime-win-x64-1.28.0.zip"
          Expand-Archive -Path "$env:TEMP\onnxruntime-win-x64.zip" -DestinationPath "$env:TEMP\ortx" -Force
          Copy-Item "$env:TEMP\ortx\onnxruntime-win-x64-1.28.0\lib\*.dll" "native" -Force
      
      - name: Build MSI installer
        working-directory: bharat-terminal/installer
        run: wix build BharatTerminal.wxs -o "../releases/BharatTerminal-v3.0.0.msi" -ext WixToolset.UI.wixext -arch x64 -d AppVersion=3.0.0
      
      - name: Create portable ZIP
        run: |
          Compress-Archive -Path "target\release\bt-app.exe","target\release\bt-cli.exe","assets","..\README.md" -DestinationPath "releases\BharatTerminal-v3.0.0-portable.zip"
      
      - name: Upload Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            releases/BharatTerminal-v3.0.0.msi
            target/release/bt-app.exe
            target/release/bt-cli.exe
            releases/BharatTerminal-v3.0.0-portable.zip
          body: |
            Bharat Terminal v3 — Made by Sourish Dey
            
            ## What's New
            - 130+ visualizations
            - Real market data (Yahoo + Coinbase)
            - Live mode with 30s auto-refresh
            - 78 companies supported
            - Forecast tab: Granite TTM + ARIMA bench + WatchSignal LSTM
            - Windows installer + portable ZIP
            
            ## Installation
            - **Installer:** Run BharatTerminal-v3.0.0.msi (per-user, no admin needed)
            - **Portable:** Extract ZIP and run bt-app.exe
            
            Bloomberg power. Zero cost. Made in India.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
